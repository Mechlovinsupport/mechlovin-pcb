<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager — Mechlovin PCB</title>
</head>
<body>
  <!-- Decap CMS loads here and reads /admin/config.yml -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
  // Live preview pane for the PCB editor: renders the actual detail-page layout
  // (using the site's real CSS) and updates as you type.
  (function () {
    if (!window.CMS) return;
    var h = window.h || (window.React && window.React.createElement);

    // Load the site fonts + page stylesheet into the preview iframe.
    CMS.registerPreviewStyle('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
    CMS.registerPreviewStyle('/cms-preview.css');
    CMS.registerPreviewStyle('/cms-guide-preview.css');
    CMS.registerPreviewStyle('/cms-home-preview.css');

    var basename = function (p) { return (p || '').split('/').pop(); };
    var stockLabel = function (s) { return s === 'in' ? 'In stock' : s === 'low' ? 'Low' : 'Out'; };
    var SWITCH_LABELS = { mx: 'MX', topre: 'Topre', he: 'HE', alps: 'ALPS' };
    var SPEC_FIELDS = [['Firmware', 'firmware'], ['Connector', 'connector'], ['MCU', 'mcu'], ['RGB', 'rgb'], ['Thickness', 'thickness'], ['Material', 'material'], ['Solder Mask Colour', 'solderMask']];
    var muted = function (msg) { return h('p', { className: 'section-sub' }, msg); };
    var head = function (title, sub) {
      return [h('h2', { key: 'h' }, title), sub ? h('div', { key: 's', className: 'section-sub' }, sub) : null];
    };

    function PcbPreview(props) {
      var entry = props.entry;
      var d = function (k) { var v = entry.getIn(['data', k]); return v && v.toJS ? v.toJS() : v; };

      var name = d('name') || 'Untitled PCB';
      var subtitle = d('subtitle') || '';
      var rev = d('rev') || '';
      var lede = d('lede') || '';
      var layout = d('layout') || '';
      var released = d('released') || '';
      var connection = d('connection') || 'wired';
      var switches = d('switches') || [];
      var features = d('features') || [];
      var specs = d('specs') || {};
      var downloads = d('downloads') || [];
      var compatibility = d('compatibility') || [];
      var changelog = d('changelog') || [];
      var vendors = d('vendors') || [];
      var layoutSvg = d('layoutSvg') || '';
      var heroImage = d('heroImage') || '';
      var images = d('images') || [];
      var gallery = [heroImage].concat(images).filter(Boolean);

      var switchTypes = switches.map(function (s) { return SWITCH_LABELS[s] || s; });
      var swLabel = switchTypes.join(' · ');
      var stats = [
        ['Layout', layout || '—'],
        ['Switch', switchTypes.length ? swLabel : '—'],
        ['Revision', rev ? rev.replace(/^Rev\.\s*/, '') : '—'],
        ['Released', released || '—']
      ];

      var typeLabel = ({ stock: 'Stock', commission: 'Commission' })[d('type')] || '';
      var tags = typeLabel ? [h('span', { key: 't', className: 'tag accent' }, typeLabel)] : [];

      var specRows = [];
      SPEC_FIELDS.forEach(function (p) {
        var val = specs[p[1]];
        if (val && String(val).trim()) specRows.push({ key: p[0], value: val });
      });
      (specs.custom || []).forEach(function (c) {
        if ((c.key && c.key.trim()) || (c.value && c.value.trim())) specRows.push({ key: c.key, value: c.value });
      });
      var specsNode = specRows.length
        ? h('div', { className: 'specs-flat' }, specRows.map(function (s, i) {
            return h('div', { className: 'spec-row', key: i }, [
              h('div', { key: 'k', className: 'k' }, s.key), h('div', { key: 'v', className: 'v' }, s.value)
            ]);
          }))
        : null;

      var layoutsList = d('layouts') || [];
      var layoutItems = layoutsList.length
        ? layoutsList.filter(function (l) { return l && l.svg; })
        : (layoutSvg ? [{ svg: layoutSvg, caption: '' }] : []);
      var layoutNode = layoutItems.length
        ? h('div', { className: 'layouts-stack' }, layoutItems.map(function (l, i) {
            return h('figure', { key: i, className: 'kle-figure' }, [
              h('div', { key: 's', className: 'kle-stage' }, h('img', { src: l.svg, className: 'layout-svg', alt: l.caption || name })),
              l.caption ? h('figcaption', { key: 'c', className: 'kle-caption' }, l.caption) : null
            ]);
          }))
        : null;

      var dlItems = downloads.filter(function (dn) { return dn.url || dn.external || dn.file; });
      var dlNode = dlItems.length
        ? h('div', { className: 'downloads-grid' }, dlItems.map(function (dn, i) {
            var link = dn.url || dn.external || dn.file || '';
            return h('div', { className: 'download-card', key: i }, [
              h('div', { key: 'f', className: 'download-card-file' }, dn.kind || 'Files'),
              dn.description ? h('p', { key: 'd', className: 'download-card-desc' }, dn.description) : null,
              h('div', { key: 'a', className: 'download-card-actions' },
                h('a', { className: 'btn btn-primary btn-sm', href: link, target: '_blank', rel: 'noopener' }, 'View on GitHub ↗'))
            ]);
          }))
        : null;

      var compatNode = compatibility.length
        ? h('div', { className: 'compat-notes' },
            h('div', { className: 'compat-groups' }, compatibility.map(function (g, i) {
              return h('div', { className: 'compat-note', key: i }, [
                h('div', { key: 't', className: 'compat-note-title' }, g.title || ''),
                h('div', { key: 'b', className: 'compat-note-body' }, g.body || '')
              ]);
            })))
        : null;

      var clNode = changelog.length
        ? h('div', { className: 'changelog' }, changelog.map(function (e, i) {
            var items = e.items || [];
            return h('div', { className: 'changelog-entry', key: i }, [
              h('div', { key: 'm', className: 'meta' }, [
                h('div', { key: 'r', className: 'rev' }, e.rev || ''),
                h('div', { key: 'd', className: 'date' }, e.date || ''),
                e.current ? h('div', { key: 'c', className: 'badge-current' }, 'current') : null
              ]),
              h('div', { key: 'b' }, [
                h('div', { key: 's', className: 'summary' }, e.summary || ''),
                h('ul', { key: 'u' }, items.map(function (it, j) {
                  return h('li', { key: j }, [
                    h('span', { key: 'k', className: 'kind ' + (it.kind || '') }, (it.kind || '').toUpperCase()),
                    h('span', { key: 't' }, it.text || '')
                  ]);
                }))
              ])
            ]);
          }))
        : null;

      var vNode = vendors.length
        ? h('table', { className: 'vendor-table' }, [
            h('thead', { key: 'h' }, h('tr', {}, [
              h('th', { key: 1 }, 'Vendor'), h('th', { key: 2 }, 'Region'), h('th', { key: 3 }, 'Stock'),
              h('th', { key: 4 }, 'Price'), h('th', { key: 5 }, 'Shipping')
            ])),
            h('tbody', { key: 'b' }, vendors.map(function (v, i) {
              return h('tr', { key: i }, [
                h('td', { key: 'n', className: 'name' }, v.name || ''),
                h('td', { key: 'r', className: 'region' }, v.region || ''),
                h('td', { key: 's' }, h('span', { className: 'stock ' + (v.stock || '') }, stockLabel(v.stock))),
                h('td', { key: 'p', className: 'price' }, v.price || ''),
                h('td', { key: 'sh', className: 'ship' }, v.shipping || '')
              ]);
            }))
          ])
        : null;

      return h('div', {}, [
        h('header', { key: 'head', className: 'pagehead' }, [
          h('div', { key: 'l' }, [
            h('h1', { key: 'n' }, name),
            subtitle ? h('div', { key: 'sub', className: 'subtitle' }, subtitle) : null,
            tags.length ? h('div', { key: 'tags', className: 'tag-row' }, tags) : null,
            lede ? h('p', { key: 'lede', className: 'lede' }, lede) : null,
            h('div', { key: 'stats', className: 'head-stats' }, stats.map(function (s, i) {
              return h('div', { key: i }, [
                h('div', { key: 'l', className: 'label' }, s[0]), h('div', { key: 'v', className: 'val' }, s[1])
              ]);
            }))
          ]),
          h('div', { key: 'r' }, [
            h('div', { key: 'img', className: 'head-image' }, gallery.length
              ? h('img', { src: gallery[0], alt: name, style: { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' } })
              : h('div', { className: 'placeholder' }, h('span', {}, 'product photo'))),
            gallery.length > 1
              ? h('div', { key: 'thumbs', className: 'head-thumbs' }, gallery.map(function (src, i) {
                  return h('div', { key: i, className: i === 0 ? 'active' : '', style: { backgroundImage: "url('" + src + "')", backgroundSize: 'cover', backgroundPosition: 'center' } });
                }))
              : null
          ])
        ]),
        h('section', { key: 'specs', className: 'section' }, [head('Specifications'), specsNode]),
        h('section', { key: 'layouts', className: 'section' }, [head('Supported layouts'), layoutNode]),
        h('section', { key: 'dl', className: 'section' }, [head('Downloads'), dlNode]),
        h('section', { key: 'compat', className: 'section' }, [
          head('Compatibility notes'),
          h('div', { key: 'cta', className: 'head-cta', style: { margin: '6px 0 18px' } },
            h('a', { className: 'btn btn-ghost btn-sm', href: '/compatibility' }, 'Check what fits your keyboard →')),
          compatNode
        ]),
        h('section', { key: 'cl', className: 'section' }, [head('Revision changelog'), clNode]),
        h('section', { key: 'vendors', className: 'section' }, [head('Where to buy'), vNode])
      ]);
    }

    CMS.registerPreviewTemplate('pcbs', PcbPreview);

    // Live preview for the Build Guides editor: renders the guide header + the
    // formatted article (headings, lists, code, images) using the real guide CSS.
    function GuidePreview(props) {
      var entry = props.entry;
      var g = function (k) { var v = entry.getIn(['data', k]); return v && v.toJS ? v.toJS() : v; };
      var title = g('title') || 'Untitled guide';
      var lede = g('lede') || '';
      var metaPairs = [['Platform', g('platform')], ['Difficulty', g('difficulty')], ['Time', g('time')], ['Updated', g('updated')]].filter(function (p) { return p[1]; });
      return h('div', { style: { padding: '20px 28px 48px', maxWidth: '820px', margin: '0 auto' } }, [
        h('header', { key: 'head', className: 'guide-header', style: { padding: '0 0 20px' } }, [
          h('h1', { key: 't' }, title),
          lede ? h('p', { key: 'l', className: 'lede' }, lede) : null,
          metaPairs.length
            ? h('div', { key: 'm', className: 'guide-meta' }, metaPairs.map(function (p, i) {
                return h('span', { key: i }, [h('strong', { key: 's' }, p[0]), ' · ' + p[1]]);
              }))
            : null
        ]),
        h('main', { key: 'body', className: 'guide-content guide-prose', style: { paddingTop: '20px' } }, props.widgetFor('body'))
      ]);
    }

    CMS.registerPreviewTemplate('guides', GuidePreview);

    // Live preview for the Home page editor.
    var HOME_LAYOUTS = ['60%', '65%', '75%', 'TKL', 'Full-Size', 'Ergo', 'Others'];
    var SEARCH_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
    var PATHWAY_DEFAULTS = [
      { meta: '60 PCBs · 7 layouts', title: 'Browse PCBs', description: 'Every board, filterable by layout. Specs, supported layouts, and downloads on each page.', icon: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h.01M11 9h.01M15 9h.01M7 13h10"/>' },
      { meta: 'Case · plate · switch · mount', title: 'Compatibility check', description: 'Filter boards by switch type, mount style, and features to find what fits your build.', icon: '<path d="M20 6 9 17l-5-5"/>' },
      { meta: 'Firmware · VIA · QMK', title: 'Build guides', description: 'Step-by-step instructions for flashing firmware, setting up VIA, and troubleshooting.', icon: '<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>' }
    ];

    function HomePreview(props) {
      var entry = props.entry;
      var d = function (k) { var v = entry.getIn(['data', k]); return v && v.toJS ? v.toJS() : v; };
      var eyebrow = d('eyebrow') || "Mechlovin' Studio · PCB resource hub";
      var headline = d('headline') || 'Specs, layouts, and firmware for every Mechlovin PCB.';
      var lede = d('lede') || 'One place for everything you need to build and maintain your keyboard.';
      var placeholder = (d('searchPlaceholder') || 'Search {count} PCBs by name or layout…').replace('{count}', '60');
      var pathwaysTitle = d('pathwaysTitle') || 'Start here';
      var featuredTitle = d('featuredTitle') || 'Featured PCBs';
      var guidesTitle = d('guidesTitle') || 'Build guides';
      var p = d('pathways') || [];
      var note = function (msg) { return h('p', { style: { color: 'var(--muted)', fontSize: '13px', margin: 0 } }, msg); };

      return h('div', {}, [
        h('header', { key: 'hero', className: 'home-hero' }, [
          h('div', { key: 'e', className: 'eyebrow' }, eyebrow),
          h('h1', { key: 'h' }, headline),
          h('p', { key: 'l', className: 'lede' }, lede),
          h('div', { key: 's', className: 'home-search', style: { maxWidth: '520px' } }, [
            h('span', { key: 'i', dangerouslySetInnerHTML: { __html: SEARCH_SVG } }),
            h('input', { key: 'in', readOnly: true, value: '', placeholder: placeholder }),
            h('span', { key: 'k', className: 'kbd' }, '⏎')
          ]),
          h('div', { key: 'c', className: 'home-layout-chips' }, [h('span', { key: 'lbl', className: 'label' }, 'Jump to a layout')].concat(
            HOME_LAYOUTS.map(function (l, i) { return h('span', { key: i, className: 'layout-chip' }, l); })
          ))
        ]),
        h('section', { key: 'paths', className: 'home-section' }, [
          h('div', { key: 'hd', className: 'home-section-head' }, h('h2', {}, pathwaysTitle)),
          h('div', { key: 'g', className: 'pathways' }, PATHWAY_DEFAULTS.map(function (def, i) {
            return h('div', { key: i, className: 'pathway' }, [
              h('div', { key: 'ic', className: 'pathway-icon' }, h('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, dangerouslySetInnerHTML: { __html: def.icon } })),
              h('h3', { key: 't' }, [(p[i] && p[i].title) || def.title, ' ', h('span', { key: 'a', className: 'pathway-arrow' }, '→')]),
              h('p', { key: 'd' }, (p[i] && p[i].description) || def.description),
              h('div', { key: 'm', className: 'pathway-meta' }, def.meta)
            ]);
          }))
        ]),
        h('section', { key: 'feat', className: 'home-section' }, [
          h('div', { key: 'hd', className: 'home-section-head' }, h('h2', {}, featuredTitle)),
          note('Your featured PCBs appear here automatically (set the “Featured” toggle on a PCB).')
        ]),
        h('section', { key: 'gd', className: 'home-section' }, [
          h('div', { key: 'hd', className: 'home-section-head' }, h('h2', {}, guidesTitle)),
          note('Your build guides appear here automatically.')
        ])
      ]);
    }

    CMS.registerPreviewTemplate('site', HomePreview);
    CMS.registerPreviewTemplate('home', HomePreview);
  })();
  </script>
</body>
</html>
