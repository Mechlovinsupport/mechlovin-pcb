# Decap CMS configuration.
# 1. Replace YOUR-GITHUB-USERNAME below with your GitHub user/org.
# 2. Commit + deploy, then visit  https://your-site/admin  and log in with GitHub.

backend:
  name: github
  repo: Mechlovinsupport/mechlovin-pcb
  branch: main
  base_url: https://mechlovin-pcb.support-ab1.workers.dev
  auth_endpoint: api/auth

# Uploaded images go here, and are served from /images.
media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "site"
    label: "Site pages"
    files:
      - name: "home"
        label: "Home page"
        file: "src/content/site/home.md"
        description: "The text on the landing page."
        fields:
          - { name: eyebrow, label: "Eyebrow (small label above the headline)", widget: string, required: false }
          - { name: headline, label: "Headline", widget: string, required: false }
          - { name: lede, label: "Intro paragraph", widget: text, required: false }
          - { name: searchPlaceholder, label: "Search box placeholder", widget: string, required: false, hint: "Use {count} for the live number of PCBs, e.g. Search {count} PCBs by name…" }
          - { name: pathwaysTitle, label: "“Start here” section title", widget: string, required: false }
          - label: "“Start here” cards"
            name: pathways
            widget: list
            required: false
            summary: "{{fields.title}}"
            hint: "Three cards: 1) Browse PCBs, 2) Compatibility check, 3) Build guides. Only the title and description are editable; the links stay fixed."
            fields:
              - { name: title, label: "Card title", widget: string }
              - { name: description, label: "Card description", widget: text }
          - { name: featuredTitle, label: "Featured section title", widget: string, required: false }
          - { name: guidesTitle, label: "Guides section title", widget: string, required: false }

  - name: "pcbs"
    label: "PCBs"
    label_singular: "PCB"
    folder: "src/content/pcbs"
    create: true
    identifier_field: name
    slug: "{{slug}}"
    summary: "{{name}} — {{layout}} · {{rev}}"
    sortable_fields: ['name', 'layout', 'released']
    fields:
      - { name: name, label: "Name", widget: string, required: false }
      - { name: slug, label: "URL slug", widget: string, required: false, hint: "Optional. Becomes /pcb/<slug>; defaults to the name if left blank." }
      - { name: subtitle, label: "Subtitle", widget: string, required: false }
      - { name: rev, label: "Revision", widget: string, required: false }
      - { name: layout, label: "Layout", widget: select, options: ["60%", "65%", "75%", "TKL", "Full-Size", "Ergo", "Others"], required: false }
      - { name: released, label: "Released", widget: string, required: false }
      - { name: featured, label: "Featured on home page", widget: boolean, default: false, required: false }
      - label: "Photos"
        name: images
        widget: list
        required: false
        field: { name: image, label: "Photo", widget: image }
        hint: "Add one or more. The first is the main photo; click any photo on the page to enlarge."
      - { name: lede, label: "Description", widget: text, required: false }

      - label: "Switch type"
        name: switches
        widget: select
        multiple: true
        required: false
        options:
          - { label: "MX", value: mx }
          - { label: "Topre", value: topre }
          - { label: "HE", value: he }
          - { label: "ALPS", value: alps }

      - label: "Specifications"
        name: specs
        widget: object
        fields:
          - { name: firmware, label: "Firmware", widget: string, required: false }
          - { name: connector, label: "Connector", widget: string, required: false, hint: "e.g. USB-C via daughterboard" }
          - { name: mcu, label: "MCU", widget: string, required: false }
          - { name: rgb, label: "RGB", widget: string, required: false }
          - { name: thickness, label: "Thickness", widget: string, required: false }
          - { name: material, label: "Material", widget: string, required: false }
          - { name: solderMask, label: "Solder Mask Colour", widget: string, required: false }
          - label: "Additional specs"
            name: custom
            widget: list
            required: false
            summary: "{{fields.key}}: {{fields.value}}"
            fields:
              - { name: key, label: "Key", widget: string }
              - { name: value, label: "Value", widget: string }

      - { name: layoutSvg, label: "Supported layouts (SVG)", widget: file, required: false, media_folder: "/public/layouts", public_folder: "/layouts", hint: "Export from keyboard-layout-editor.com → Download SVG" }

      - label: "Downloads (GitHub links)"
        name: downloads
        widget: list
        summary: "{{fields.kind}}"
        required: false
        fields:
          - { name: kind, label: "Label", widget: string, hint: "QMK Firmware / VIA JSON / 3D Model" }
          - { name: url, label: "GitHub link", widget: string, hint: "Link to this PCB's folder or file on GitHub" }
          - { name: description, label: "Description", widget: string, required: false }

      - label: "Compatibility notes"
        name: compatibility
        widget: list
        summary: "{{fields.title}}"
        required: false
        fields:
          - { name: title, label: "Heading", widget: string, hint: "Cases / Plates / Switches / Stabilizers" }
          - { name: body, label: "Notes", widget: text }

      - label: "Changelog"
        name: changelog
        widget: list
        summary: "{{fields.rev}} ({{fields.date}})"
        required: false
        fields:
          - { name: rev, label: "Revision", widget: string }
          - { name: date, label: "Date", widget: string }
          - { name: current, label: "Current revision", widget: boolean, default: false }
          - { name: summary, label: "Summary", widget: text }
          - label: "Changes"
            name: items
            widget: list
            required: false
            summary: "{{fields.kind}}: {{fields.text}}"
            fields:
              - { name: kind, label: "Type", widget: select, options: ["add", "fix", "chg", "rm"] }
              - { name: text, label: "Description", widget: string }

      - label: "Vendors"
        name: vendors
        widget: list
        summary: "{{fields.name}} — {{fields.price}}"
        required: false
        fields:
          - { name: name, label: "Vendor", widget: string }
          - { name: region, label: "Region", widget: string }
          - { name: stock, label: "Stock", widget: select, options: ["in", "low", "out"] }
          - { name: price, label: "Price", widget: string }
          - { name: shipping, label: "Shipping", widget: string }
          - { name: url, label: "Store URL", widget: string }

  - name: "keyboards"
    label: "Keyboards / cases (compatibility DB)"
    label_singular: "Keyboard"
    folder: "src/content/keyboards"
    create: true
    identifier_field: name
    slug: "{{slug}}"
    summary: "{{name}} — {{vendor}} · {{layout}}"
    fields:
      - { name: name, label: "Name", widget: string }
      - { name: aliases, label: "Search aliases", widget: list, required: false, hint: "Lowercase nicknames people search for, e.g. tofu65" }
      - { name: vendor, label: "Vendor", widget: string }
      - { name: layout, label: "Layout", widget: select, options: ["60%", "65%", "75%", "TKL", "Full-Size", "Ergo", "Others"] }
      - { name: connector, label: "USB connector", widget: select, options: [{ label: "Onboard USB", value: onboard }, { label: "Daughterboard (JST)", value: daughterboard }] }
      - label: "Compatible PCBs"
        name: matches
        widget: list
        required: false
        summary: "{{fields.pcb}} ({{fields.fit}})"
        fields:
          - { name: pcb, label: "PCB", widget: relation, collection: "pcbs", search_fields: ["name", "slug"], value_field: "slug", display_fields: ["name"] }
          - { name: fit, label: "Fit", widget: select, options: ["direct", "mods"] }
          - { name: note, label: "Note", widget: string }

  - name: "guides"
    label: "Build guides"
    label_singular: "Guide"
    folder: "src/content/guides"
    create: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: lede, label: "Short intro", widget: text, required: false, hint: "One or two sentences shown under the title." }
      - { name: tag, label: "Tag", widget: string, required: false, hint: "e.g. Firmware, VIA, QMK" }
      - { name: order, label: "Order in the guides list", widget: number, default: 99, value_type: int, required: false }
      - { name: platform, label: "Platform", widget: string, required: false, hint: "e.g. Windows · macOS" }
      - { name: difficulty, label: "Difficulty", widget: string, required: false, hint: "e.g. Beginner" }
      - { name: time, label: "Time to complete", widget: string, required: false, hint: "e.g. ~5 min" }
      - { name: updated, label: "Last updated", widget: string, required: false, hint: "e.g. Jun 2026" }
      - { name: body, label: "Article", widget: markdown, hint: "Write the guide here. Use the toolbar for headings, bold, lists, links, code, and to insert images. Each big heading (Heading 2) automatically becomes a section in the on-page table of contents." }
